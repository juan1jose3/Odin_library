<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="modern-normalize.css">
	<link rel="stylesheet" href="styles.css">
	<title>Library</title>
</head>
<body>
    <div class="image-holder">
        
    </div>

    <div class="main-container">
        <div class="library-container">
            <h1>Personal Library</h1>
            <div class="book-section">
                <h2> <img src="assets/bookmarks-outline-svgrepo-com.svg" alt=""class="icon" >My Book Collection:</h2>
                <div class="book-collection"></div>
            </div>

            <button class="add-book glass-button" command="show-modal" commandfor="book-dialog">Add new Book!</button>

            <dialog id="book-dialog">
                <form>
                    <fieldset>
                        <legend>Add a New Book!</legend>
                        <div class="entry-container">
                            <div class="form-entry">
                                <label for="book-title">Title:</label>
                                <input type="text" id="book-title" name="bookTitle" required>
                            </div>
                            <div class="form-entry">
                                <label for="book-author">Author:</label>
                                <input type="text" name="bookAuthor" id="book-author" required>
                            </div>
                            <div class="form-entry">
                                <label for="book-pages">Pages:</label>
                                <input type="tel" name="bookPages" id="book-pages" pattern="^[0-9]+$"  title="Please enter a number" required>
                            </div>

                            <div>
                                <input type="radio" name="readStatus" id="status" value="read" checked required>
                                <label for="status">Read</label>
                            </div>

                            <div>
                                <input type="radio" name="readStatus" id="status" value="not-read" required>
                                <label for="status">Not Read</label>
                            </div>

                            <div class="drag-drop-container upload-file">
                                <label for="book-cover">Upload a Book Cover (Optional)</label>
                                <input type="file" id="book-cover" name="bookCoverImg" accept="image/png/jpg">
                            </div>
                        </div>
                    </fieldset>
                    <button class="glass-button" type="submit">Add New!</button>
                </form>
                <button class="modal-close glass-button" commandfor="book-dialog" command="close">Close</button>
            </dialog>
        </div>
    </div>

    <script src="js/libraryAdmin.js" defer></script>
    
</body>
</html>
