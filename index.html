<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="modern-normalize.css">
	<link rel="stylesheet" href="styles.css">
	<title>Library</title>
</head>
<body>
    <div class="image-holder">
        
    </div>

    <div class="main-container">
        <div class="library-container">
            <h1>Personal Library</h1>
            <div class="book-section">
                <h2> <img src="assets/bookmarks-outline-svgrepo-com.svg" alt=""class="icon" >My Book Collection:</h2>
                <div class="book-collection">
                    <div class="book-card">
                        <div class="title-wrapper">
                            <h3>The Dunwich Horror</h3>
                            <div class="book-info">
                                <p>Author: H.P Lovecraft</p>
                                <div class="book-cover-container">
                                    <img src="assets/dunwich.jpg" alt="" class="book-cover">
                                </div>
                                <p>Pages: 128</p>

                                <div class="button-section">
                                    <button class="not-read-button" bookId="1">Not read</button>
                                    <button class="remove-button" bookId="1">Remove</button>
                                </div>
                            </div>
                            
                        </div>
                        
                    </div>
                    <div class="book-card">
                        <div class="title-wrapper">
                            <h3>The Call Of Cthulhu</h3>
                            <div class="book-info">
                                <p>Author: H.P Lovecraft</p>
                                <div class="book-cover-container">
                                    <img src="assets/the_call.jpg" alt="" class="book-cover">
                                </div>
                                
                                <p>Pages: 60</p>
                                
                                <div class="button-section">
                                    <button class="read-button" bookId="2">Read</button>
                                    <button class="remove-button" bookId="2">Remove</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="book-card">
                        <div class="title-wrapper">
                            <h3>The Hobbit</h3>
                            <div class="book-info">
                                <p>Author: J.R.R Tolkien</p>
                                <div class="book-cover-container">
                                    <img src="assets/the_hobbit.jpg" alt="" class="book-cover">
                                </div>
                                <p>Pages: 600</p>
                                <div class="button-section">
                                    <button class="read-button" bookId="3">Read</button>
                                    <button class="remove-button" bookId="3">Remove</button>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>

            <button class="add-book glass-button" command="show-modal" commandfor="book-dialog">Add new Book!</button>

            <dialog id="book-dialog">
                <form>
                    <fieldset>
                        <legend>Add a New Book!</legend>
                        <div class="entry-container">
                            <div class="form-entry">
                                <label for="book-title">Title:</label>
                                <input type="text" id="book-title" name="bookTitle" required>
                            </div>
                            <div class="form-entry">
                                <label for="book-author">Author:</label>
                                <input type="text" name="bookAuthor" id="book-author" required>
                            </div>
                            <div class="form-entry">
                                <label for="book-pages">Pages:</label>
                                <input type="tel" name="bookPages" id="book-pages" required>
                            </div>

                            <div>
                                <input type="radio" name="readStatus" id="status" value="read" checked required>
                                <label for="status">Read</label>
                            </div>

                            <div>
                                <input type="radio" name="readStatus" id="status" value="not-read" required>
                                <label for="status">Not Read</label>
                            </div>
                        </div>
                    </fieldset>
                    <button class="glass-button" type="submit">Add New!</button>
                </form>
                <button class="modal-close glass-button" commandfor="book-dialog" command="close">Close</button>
            </dialog>
        </div>
    </div>

    <script src="js/libraryAdmin.js" defer></script>
    
</body>
</html>
